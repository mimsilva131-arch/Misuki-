name: Fix statistics data source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch statistics backend and formatter
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          backend = Path('backend/app.py')
          stats = Path('website/statistics.html')

          b = backend.read_text(encoding='utf-8')
          s = stats.read_text(encoding='utf-8')

          # -------------------------------------------------------
          # /statistics: stop reading the stale repository JSON.
          # The bot writes live statistics to PostgreSQL.
          # -------------------------------------------------------
          start = b.index('    # =====================================================\n    # BOT SNAPSHOT\n    # =====================================================\n\n    bot_snapshot = {}', b.index('@app.route("/statistics")'))
          end = b.index('    # =====================================================\n    # HEARTBEAT\n    # =====================================================', start)

          replacement = '''    # =====================================================
    # BOT SNAPSHOT — POSTGRESQL
    # =====================================================

    bot_snapshot = {}

    try:
        with database_connection() as connection:
            with connection.cursor() as cursor:
                cursor.execute(
                    """
                    SELECT
                        servers,
                        users,
                        channels,
                        latency,
                        commands,
                        tickets,
                        moderation_actions,
                        announcements,
                        verifications,
                        bot_status,
                        uptime,
                        version,
                        last_seen,
                        admin_servers,
                        updated_at
                    FROM bot_statistics
                    WHERE id = 1
                    """
                )
                result = cursor.fetchone()

                if result:
                    bot_snapshot = {
                        "servers": result[0],
                        "users": result[1],
                        "channels": result[2],
                        "latency": result[3],
                        "commands": result[4],
                        "tickets": result[5],
                        "moderation_actions": result[6],
                        "announcements": result[7],
                        "verifications": result[8],
                        "bot_status": result[9],
                        "uptime": result[10],
                        "version": result[11],
                        "last_seen": result[12],
                        "admin_servers": result[13] or [],
                        "updated_at": result[14],
                    }

                    for key in (
                        "servers",
                        "users",
                        "channels",
                        "latency",
                        "commands",
                        "tickets",
                        "moderation_actions",
                        "announcements",
                        "verifications",
                        "bot_status",
                        "uptime",
                        "updated_at",
                    ):
                        if key in bot_snapshot:
                            statistics_data[key] = bot_snapshot[key]

                    statistics_data["version"] = os.getenv(
                        "MISUKI_VERSION",
                        "1.0.0"
                    )

    except Exception as error:
        print(f"⚠️ Could not load live bot statistics: {error}")

'''
          b = b[:start] + replacement + b[end:]

          # Ensure API activity fields always exist and are refreshed from PostgreSQL.
          api_marker = '    # =====================================================\n    # RESPONSE\n    # =====================================================\n'
          api_pos = b.index(api_marker, b.index('@app.route("/api/statistics")'))
          activity_block = '''    # =====================================================
    # ACTIVITY COUNTERS — POSTGRESQL
    # =====================================================

    try:
        with database_connection() as activity_connection:
            with activity_connection.cursor() as activity_cursor:
                activity_cursor.execute(
                    """
                    SELECT tickets, moderation_actions, announcements
                    FROM bot_statistics
                    WHERE id = 1
                    """
                )
                activity_row = activity_cursor.fetchone()
                if activity_row:
                    statistics_data["tickets"] = int(activity_row[0] or 0)
                    statistics_data["moderation_actions"] = int(activity_row[1] or 0)
                    statistics_data["announcements"] = int(activity_row[2] or 0)
    except Exception as error:
        print(f"⚠️ Could not load activity counters: {error}")

'''
          if '    # ACTIVITY COUNTERS — POSTGRESQL' not in b[b.index('@app.route("/api/statistics")'):api_pos]:
              b = b[:api_pos] + activity_block + b[api_pos:]

          # Add safe defaults to the API statistics dictionary.
          api_start = b.index('@app.route("/api/statistics")')
          init_start = b.index('    statistics_data = {', api_start)
          init_end = b.index('    }', init_start) + len('    }')
          init = b[init_start:init_end]
          if '"moderation_actions": 0' not in init:
              init = init.replace('        "verifications": 0,', '        "verifications": 0,\n\n        "moderation_actions": 0,\n\n        "announcements": 0,', 1)
              b = b[:init_start] + init + b[init_end:]

          # Deterministic Portugal date/time: dd/mm/yyyy hh:mm.
          old = '''        return new Date(\n            numericValue * 1000\n        ).toLocaleString();'''
          new = '''        const formatted = new Intl.DateTimeFormat(\n            "pt-PT",\n            {\n                timeZone: "Europe/Lisbon",\n                day: "2-digit",\n                month: "2-digit",\n                year: "numeric",\n                hour: "2-digit",\n                minute: "2-digit",\n                hour12: false\n            }\n        ).format(new Date(numericValue * 1000));\n\n        return formatted.replace(\n            ", ",\n            " "\n        );'''
          if old not in s:
              raise SystemExit('Expected statistics date formatter was not found.')
          s = s.replace(old, new, 1)

          backend.write_text(b, encoding='utf-8')
          stats.write_text(s, encoding='utf-8')
          PY

      - name: Validate patched files
        run: |
          python -m py_compile backend/app.py
          grep -q 'ACTIVITY COUNTERS — POSTGRESQL' backend/app.py
          grep -q 'Europe/Lisbon' website/statistics.html
          grep -q 'SELECT.*tickets' backend/app.py || true

      - name: Commit fixes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app.py website/statistics.html
          git diff --cached --check
          git commit -m 'Fix live statistics data and date formatting'
          git rm .github/workflows/fix-statistics-data-source.yml
          git commit -m 'Remove temporary statistics fix workflow'
          git push
