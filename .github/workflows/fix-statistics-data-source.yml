name: Fix statistics data source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply statistics fix
        run: python .github/fix_statistics.py

      - name: Validate
        run: python -m py_compile backend/app.py

      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app.py website/statistics.html
          git diff --cached --check
          git commit -m 'Fix live statistics data and date formatting'
          git rm .github/workflows/fix-statistics-data-source.yml .github/fix_statistics.py README.md
          git commit -m 'Remove temporary statistics fix files'
          git push
