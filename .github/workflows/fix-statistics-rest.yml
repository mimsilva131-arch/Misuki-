name: Fix remaining statistics robustness

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply statistics fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          # ---------------------------------------------------------
          # Backend: every activity counter must have a safe fallback.
          # ---------------------------------------------------------
          backend = Path("backend/app.py")
          text = backend.read_text(encoding="utf-8")

          replacements = {
              '"commands": statistics_data["commands"],': '"commands": int(statistics_data.get("commands", 0) or 0),',
              '"tickets": statistics_data["tickets"],': '"tickets": int(statistics_data.get("tickets", 0) or 0),',
              '"moderation": statistics_data["moderation_actions"],': '"moderation": int(statistics_data.get("moderation_actions", 0) or 0),',
              '"announcements": statistics_data["announcements"],': '"announcements": int(statistics_data.get("announcements", 0) or 0),',
          }

          changed = False
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True

          if changed:
              backend.write_text(text, encoding="utf-8")

          # ---------------------------------------------------------
          # Bot: keep an accurate human-member count per guild.
          # The global count already fetches members from Discord;
          # reuse those fetched results for admin_servers instead of
          # relying on a potentially incomplete guild cache.
          # ---------------------------------------------------------
          bot = Path("bot.py")
          text = bot.read_text(encoding="utf-8")

          if "BOT_GUILD_HUMAN_COUNTS = {}" not in text:
              text = text.replace(
                  "BOT_INSTALLERS = {}\n",
                  "BOT_INSTALLERS = {}\nBOT_GUILD_HUMAN_COUNTS = {}\n",
                  1,
              )

          text = text.replace(
              "async def count_statistics_users():\n    \"\"\"Count unique human Discord users across all guilds.\"\"\"\n    user_ids = set()",
              "async def count_statistics_users():\n    \"\"\"Count unique human Discord users across all guilds.\"\"\"\n    BOT_GUILD_HUMAN_COUNTS.clear()\n    user_ids = set()",
              1,
          )

          text = text.replace(
              "                user_ids.add(member_id)\n\n        except Exception as error:",
              "                user_ids.add(member_id)\n\n            BOT_GUILD_HUMAN_COUNTS[str(guild.id)] = len(\n                [member_id for member_id in guild_seen\n                 if member_id in user_ids]\n            )\n\n        except Exception as error:",
              1,
          )

          text = text.replace(
              "                user_ids.add(member_id)\n\n    print(f\"   Members scanned:",
              "                user_ids.add(member_id)\n\n            BOT_GUILD_HUMAN_COUNTS[str(guild.id)] = len(\n                [member_id for member_id in guild_seen\n                 if member_id in user_ids]\n            )\n\n    print(f\"   Members scanned:",
              1,
          )

          text = text.replace(
              '            "members": sum(\n                1 for member in guild.members if is_human_member(member)\n            )',
              '            "members": BOT_GUILD_HUMAN_COUNTS.get(\n                str(guild.id),\n                sum(1 for member in guild.members if is_human_member(member))\n            )',
              1,
          )

          bot.write_text(text, encoding="utf-8")
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app.py bot.py
          git diff --cached --quiet && exit 0
          git commit -m "Harden statistics and member counts"
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/fix-statistics-rest.yml || true
          git commit -m "Remove temporary statistics workflow" || true
          git push || true
