name: Fix Last Update display

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix Last Update timestamp formatting
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('website/statistics.html')
          s = p.read_text(encoding='utf-8')

          old = '''                    {% if statistics is defined and statistics.updated_at is not none %}\n                        {{ statistics.updated_at if statistics.updated_at else "—" }}\n                    {% else %}\n                        —\n                    {% endif %}'''
          new = '''                    {% if statistics is defined and statistics.updated_at is not none and statistics.updated_at %}\n                        {{ statistics.updated_at | timestamp_eu }}\n                    {% else %}\n                        —\n                    {% endif %}'''
          if old in s:
              s = s.replace(old, new, 1)
          else:
              print('Template block already changed or not found; continuing.')

          marker = '<script>'
          if 'function formatStatisticsDate(value)' not in s:
              func = '''<script>\n    function formatStatisticsDate(value) {\n        const numericValue = Number(value);\n        if (!Number.isFinite(numericValue) || numericValue <= 0) return "—";\n\n        const date = new Date(numericValue * 1000);\n        if (Number.isNaN(date.getTime())) return "—";\n\n        const day = String(date.getDate()).padStart(2, "0");\n        const month = String(date.getMonth() + 1).padStart(2, "0");\n        const year = date.getFullYear();\n        const hours = String(date.getHours()).padStart(2, "0");\n        const minutes = String(date.getMinutes()).padStart(2, "0");\n\n        return `${day}/${month}/${year} ${hours}:${minutes}`;\n    }\n\n'''
              s = s.replace(marker, func, 1)

          s = s.replace(
              'lastUpdate.textContent =\n                data.updated_at;',
              'lastUpdate.textContent =\n                formatStatisticsDate(data.updated_at);'
          )
          s = s.replace(
              'lastUpdate.textContent = data.updated_at;',
              'lastUpdate.textContent = formatStatisticsDate(data.updated_at);'
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Add Jinja timestamp filter
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path('backend/app.py'), Path('app.py')]
          p = next((x for x in candidates if x.exists()), None)
          if p is None:
              raise SystemExit('Could not find Flask app.py')

          s = p.read_text(encoding='utf-8')
          if 'def timestamp_eu(' not in s:
              marker = 'app = Flask(__name__)'
              if marker not in s:
                  marker = 'app=Flask(__name__)'
              if marker not in s:
                  raise SystemExit('Could not find Flask app initialization')

              block = '''\n\ndef timestamp_eu(value):\n    """Format Unix timestamp as Portuguese/European DD/MM/YYYY HH:MM."""\n    try:\n        from datetime import datetime\n        return datetime.fromtimestamp(float(value)).strftime("%d/%m/%Y %H:%M")\n    except (TypeError, ValueError, OverflowError):\n        return "—"\n\n\napp.jinja_env.filters["timestamp_eu"] = timestamp_eu\n'''
              s = s.replace(marker, marker + block, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fixes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/statistics.html backend/app.py app.py .github/workflows/fix-last-update.yml 2>/dev/null || true
          git commit -m 'Fix Last Update date formatting' || exit 0
          git rm .github/workflows/fix-last-update.yml
          git commit -m 'Remove temporary Last Update fix workflow'
          git push
