name: Fix Last Update display

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix Last Update display
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('website/statistics.html')
          s = p.read_text(encoding='utf-8')

          old = '''                    {% if statistics is defined and statistics.updated_at is not none %}\n                        {{ statistics.updated_at if statistics.updated_at else "—" }}\n                    {% else %}\n                        —\n                    {% endif %}'''
          new = '''                    {% if statistics is defined and statistics.updated_at is not none and statistics.updated_at %}\n                        <span data-statistics-timestamp="{{ statistics.updated_at }}">\n                            {{ statistics.updated_at }}\n                        </span>\n                    {% else %}\n                        —\n                    {% endif %}'''
          if old in s:
              s = s.replace(old, new, 1)

          old_function = '''    function formatStatisticsDate(value) {\n\n        if (\n            value === null ||\n            value === undefined ||\n            value === ""\n        ) {\n\n            return "—";\n\n        }\n\n\n        const numericValue = Number(value);\n\n\n        if (\n            !Number.isFinite(numericValue) ||\n            numericValue <= 0\n        ) {\n\n            return "—";\n\n        }\n\n\n        return new Date(\n            numericValue * 1000\n        ).toLocaleString();\n\n    }'''
          new_function = '''    function formatStatisticsDate(value) {\n\n        const numericValue = Number(value);\n\n        if (\n            !Number.isFinite(numericValue) ||\n            numericValue <= 0\n        ) {\n\n            return "—";\n\n        }\n\n        const date = new Date(\n            numericValue * 1000\n        );\n\n        if (Number.isNaN(date.getTime())) {\n\n            return "—";\n\n        }\n\n        const day = String(date.getDate()).padStart(2, "0");\n        const month = String(date.getMonth() + 1).padStart(2, "0");\n        const year = date.getFullYear();\n        const hours = String(date.getHours()).padStart(2, "0");\n        const minutes = String(date.getMinutes()).padStart(2, "0");\n\n        return `${day}/${month}/${year} ${hours}:${minutes}`;\n\n    }\n\n\n    function formatInitialStatisticsDate() {\n\n        const lastUpdate =\n            document.getElementById(\n                "statistics-last-update"\n            );\n\n        if (!lastUpdate) {\n\n            return;\n\n        }\n\n        const timestamp =\n            lastUpdate.querySelector(\n                "[data-statistics-timestamp]"\n            );\n\n        if (!timestamp) {\n\n            return;\n\n        }\n\n        timestamp.textContent =\n            formatStatisticsDate(\n                timestamp.dataset.statisticsTimestamp\n            );\n\n    }'''
          if old_function in s:
              s = s.replace(old_function, new_function, 1)

          if 'formatInitialStatisticsDate();' not in s:
              marker = '    function renderServerList(servers) {'
              s = s.replace(
                  marker,
                  '    formatInitialStatisticsDate();\n\n\n' + marker,
                  1
              )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/statistics.html .github/workflows/fix-last-update.yml
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Fix Last Update date formatting'
          git rm .github/workflows/fix-last-update.yml
          git commit -m 'Remove temporary Last Update fix workflow'
          git push
