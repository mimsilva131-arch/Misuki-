{% extends "base.html" %}

{% block title %}
{% if title %}
    {{ title }} — Misuki
{% else %}
    Error — Misuki
{% endif %}
{% endblock %}

{% block content %}

<main>

    <section class="section">

        <div class="container">

            <div
                class="card"
                style="
                    text-align:center;
                    max-width:760px;
                    margin:40px auto;
                "
            >

                <h1>
                    {{ title or "Error" }}
                </h1>

                <p class="muted">
                    Something went wrong
                </p>

                {% if message %}

                    <p
                        style="
                            margin-top:20px;
                            line-height:1.6;
                        "
                    >
                        {{ message }}
                    </p>

                {% endif %}

                <div style="margin-top:40px;">

                    <a
                        href="/"
                        class="button"
                    >
                        Return Home
                    </a>

                    <a
                        href="/login"
                        class="button"
                        style="margin-left:10px;"
                    >
                        Try Login Again
                    </a>

                </div>

            </div>

        </div>

    </section>

</main>

{% endblock %}
