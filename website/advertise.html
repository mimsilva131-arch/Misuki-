<!DOCTYPE html>
<html lang="en">

<head>
<link rel="icon" type="image/png" href="/assets/images/favicon.png?v=2">
<link rel="shortcut icon" type="image/png" href="/assets/images/favicon.png?v=2">
<link rel="stylesheet" href="/css/stars.css">
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Advertise — Misuki</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css?v=11"
    >

</head>
<script src="/js/stars.js" defer></script>
<body>

<header class="container">

    <a class="logo" href="/">
        Misuki<span>.</span>
    </a>

    <a
        href="/dashboard"
        class="button manage"
    >
        Dashboard
    </a>

</header>


<main>

<section class="section">

    <div class="container">

        <div class="form">

            <h1>
                📢 Advertise on Misuki
            </h1>

            <p>
                Promote your server, project or service
                to the Misuki community.
            </p>


            <form
                method="POST"
                action="/advertise"
            >

                <label>
                    Advertisement title
                </label>

                <input
                    type="text"
                    name="title"
                    maxlength="80"
                    required
                    placeholder="My Discord Server"
                >


                <label>
                    Description
                </label>

                <textarea
                    name="description"
                    maxlength="500"
                    required
                    placeholder="Tell people about your server..."
                ></textarea>


                <label>
                    Image URL
                </label>

                <input
                    type="url"
                    name="image_url"
                    maxlength="500"
                    placeholder="https://example.com/image.png"
                >


                <label>
                    Destination URL
                </label>

                <input
                    type="url"
                    name="target_url"
                    maxlength="500"
                    required
                    placeholder="https://discord.gg/example"
                >


                <label>
                    Duration
                </label>

                <select
                    name="duration"
                    required
                >

                    <option value="7">
                        7 days
                    </option>

                    <option value="14">
                        14 days
                    </option>

                    <option value="30">
                        30 days
                    </option>

                </select>


                <button
                    type="submit"
                    class="button manage"
                >
                    📢 Submit Advertisement
                </button>

            </form>

        </div>

    </div>

</section>

</main>


<footer>

    <div>
        © 2026 Misuki. All rights reserved.
    </div>

    <div class="footer-links">

        <a href="/terms">Terms</a>

        <a href="/privacy">Privacy</a>

        <a href="/cookies">Cookies</a>

    </div>

</footer>

</body>

</html>
