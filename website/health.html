<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="/assets/images/favicon.png?v=4"><link rel="shortcut icon" type="image/png" href="/assets/images/favicon.png?v=4"><link rel="apple-touch-icon" href="/assets/images/favicon.png?v=4"><title>Misuki Status</title><style>:root{color-scheme:dark;--bg:#08090c;--card:#101218;--line:#242731;--muted:#8d93a1;--text:#f5f7fb;--good:#36d399;--bad:#ff6b6b;--warn:#f7c948;--unknown:#444957}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#171a24,#08090c 45%);color:var(--text);font-family:Inter,system-ui,sans-serif}main{width:min(1050px,calc(100% - 32px));margin:auto;padding:58px 0 70px}.brand{font-weight:800;font-size:30px;letter-spacing:-.04em}.sub{color:var(--muted);margin:6px 0 34px}.hero,.history,.card{background:var(--card);border:1px solid var(--line);border-radius:22px}.hero{padding:30px}.hero h1{margin:0 0 8px;font-size:34px}.hero p,.history p{color:var(--muted)}.today{margin:0 0 18px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:13px;background:rgba(255,255,255,.025)}.overall{display:flex;align-items:center;gap:10px;margin-top:22px;font-weight:700}.dot{width:11px;height:11px;border-radius:50%;background:var(--good)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}.card{padding:22px}.card h2{font-size:17px;margin:0 0 17px}.state{display:flex;align-items:center;gap:9px;font-weight:700}.state i{width:9px;height:9px;border-radius:50%;background:var(--good)}.state.down i{background:var(--bad)}.state.degraded i{background:var(--warn)}.state.unknown i{background:var(--unknown)}.history{margin-top:18px;padding:24px}.history h2{margin:0 0 6px}.history p{margin:0 0 22px;font-size:14px}.row{display:grid;grid-template-columns:90px 1fr;gap:16px;align-items:center;margin:17px 0}.label{font-weight:700;font-size:14px}.bar{height:18px;display:flex;gap:3px;overflow:hidden}.seg{height:100%;flex:1;min-width:4px;background:var(--unknown);border-radius:2px;cursor:pointer;transition:background .16s ease,box-shadow .16s ease}.seg.selected{box-shadow:inset 0 0 0 2px rgba(255,255,255,.95)}.seg.today{box-shadow:inset 0 0 0 1px rgba(255,255,255,.65)}.seg.operational{background:var(--good)}.seg.down{background:var(--bad)}.seg.degraded{background:var(--warn)}.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:22px}.legend span{display:flex;gap:7px;align-items:center}.legend i{width:8px;height:8px;border-radius:2px;background:var(--good);box-shadow:0 0 0 1px rgba(255,255,255,.08)}.legend .degraded{background:var(--warn)}.legend .bad{background:var(--bad)}.legend .unknown{background:var(--unknown)}.day-details{margin-top:20px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025);color:var(--muted);font-size:13px;line-height:1.6;white-space:pre-line;min-height:48px}.day-details.visible{color:var(--text)}.seg:focus{outline:none}.seg.selected{box-shadow:inset 0 0 0 2px rgba(255,255,255,.95)}.updated{color:var(--muted);font-size:12px;margin-top:20px}@media(max-width:700px){main{width:calc(100% - 20px);padding-top:30px}.grid{grid-template-columns:1fr}.hero{padding:24px}.hero h1{font-size:28px}.row{grid-template-columns:72px 1fr}.bar{height:15px;gap:2px}.seg{min-width:2px}}</style></head><body><main><div class="brand">Misuki</div><div class="sub">Service status</div><section class="hero"><h1 id="headline">Checking systems…</h1><p id="summary">Checking the API, database and bot.</p><div class="overall"><span class="dot" id="overallDot"></span><span id="overallText">Checking</span></div></section><div class="grid"><div class="card"><h2>API</h2><div class="state" id="api"><i></i><span>Checking…</span></div></div><div class="card"><h2>Database</h2><div class="state" id="database"><i></i><span>Checking…</span></div></div><div class="card"><h2>Bot</h2><div class="state" id="bot"><i></i><span>Checking…</span></div></div></div><section class="history"><h2>90-day status</h2><div class="row"><div class="label">API</div><div class="bar" id="apiBar"></div></div><div class="row"><div class="label">Database</div><div class="bar" id="databaseBar"></div></div><div class="row"><div class="label">Bot</div><div class="bar" id="botBar"></div></div><div class="legend"><span><i></i>Operational</span><span><i class="degraded"></i>Degraded</span><span><i class="bad"></i>Unavailable</span><span><i class="unknown"></i>No data</span></div><div class="day-details" id="dayDetails" aria-live="polite">Select a day to see its recorded status and error times.</div></section></main><script>const labels={operational:"Operational",down:"Unavailable",degraded:"Degraded",unknown:"No data"};let selectedSegment=null;function paint(id,s){const e=document.getElementById(id);e.className="state "+s;e.querySelector("span").textContent=labels[s]||"No data"}function formatIncidentTime(value){if(!value)return null;const d=new Date(value);return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});}
function showDay(day,key){const incidents=(day.incidents||[]).filter(i=>i.service===key && ["down","degraded"].includes(i.status));let detail=day.date+" — "+(labels[day[key]]||"No data");if(incidents.length){detail+="<br><br>"+incidents.map(i=>{const start=formatIncidentTime(i.started_at)||"Unknown";const end=formatIncidentTime(i.ended_at)||"Still ongoing";return (labels[i.status]||i.status)+": "+start+"–"+end;}).join("<br>");}else{detail+="<br><br>No recorded errors on this day.";}return detail;}
function showDayPlain(day,key){const incidents=(day.incidents||[]).filter(i=>i.service===key && ["down","degraded"].includes(i.status));let detail=day.date+" — "+(labels[day[key]]||"No data");if(incidents.length){detail+="\n\n"+incidents.map(i=>{const start=formatIncidentTime(i.started_at)||"Unknown";const end=formatIncidentTime(i.ended_at)||"Still ongoing";return (labels[i.status]||i.status)+": "+start+"–"+end;}).join("\n");}else{detail+="\n\nNo recorded errors on this day.";}return detail;}
function bar(id,days,key,today){const e=document.getElementById(id);e.innerHTML="";days.forEach(d=>{const s=document.createElement("span");s.className="seg "+(d[key]||"unknown")+(d.date===today?" today":"");s.title=showDayPlain(d,key);s.tabIndex=0;s.setAttribute("role","button");const open=()=>{if(selectedSegment)selectedSegment.classList.remove("selected");selectedSegment=s;s.classList.add("selected");document.getElementById("dayDetails").innerHTML=showDay(d,key);document.getElementById("dayDetails").classList.add("visible");};s.addEventListener("click",open);s.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();open();}});e.appendChild(s)})}async function load(){try{const r=await fetch("/api/health",{cache:"no-store"}),d=await r.json(),c=d.current;paint("api",c.api);paint("database",c.database);paint("bot",c.bot);const today=d.today||d.days[d.days.length-1]?.date||"Today";bar("apiBar",d.days,"api",today);bar("databaseBar",d.days,"database",today);bar("botBar",d.days,"bot",today);const ok=[c.api,c.database,c.bot].every(x=>x==="operational");document.getElementById("headline").textContent=ok?"All systems operational":"Some systems need attention";document.getElementById("summary").textContent=ok?"Misuki is operating normally.":"One or more Misuki services are currently unavailable or degraded.";document.getElementById("overallText").textContent=ok?"Operational":"Attention required";document.getElementById("overallDot").style.background=ok?"var(--good)":"var(--bad)";document.getElementById("updated").textContent="Last checked: "+new Date(d.updated_at).toLocaleString()}catch(e){document.getElementById("headline").textContent="Status unavailable";document.getElementById("summary").textContent="The status API could not be reached."}}load();setInterval(load,30000)</script></body></html>
