<!-- =====================================================
     SIDE MENU
====================================================== -->

<nav
    class="menu"
    id="menu"
    aria-hidden="true"
>

    <div class="menu-header">

        <div class="menu-title" data-i18n="menu.title">
            Menu
        </div>

        <button
            class="menu-close"
            id="menuClose"
            type="button"
            aria-label="Close menu"
            data-i18n-attr="aria-label:menu_controls.close"
        >
            ×
        </button>

    </div>


    <!-- =================================================
         NAVIGATION
    ================================================== -->

    <div class="menu-section" data-i18n="menu.navigation">
        Navigation
    </div>

    <a href="/" data-i18n="nav.home">
        Home
    </a>

    <a href="/dashboard" data-i18n="nav.dashboard">
        Dashboard
    </a>

    <a href="/reviews" data-i18n="nav.reviews">
        Reviews
    </a>

    <a href="/statistics" data-i18n="nav.statistics">
        Statistics
    </a>


    <!-- =================================================
         RESOURCES
    ================================================== -->

    <div class="menu-section" data-i18n="menu.resources">
        Resources
    </div>

    <a href="/documentation" data-i18n="nav.documentation">
        Documentation
    </a>

    <a href="/support" data-i18n="nav.support">
        Support
    </a>

    <a href="/advertise" data-i18n="nav.advertisement">
        Advertisement
    </a>

    {% if is_admin(user) %}

        <a href="/admin/advertise" data-i18n="nav.advertisement_admin">
            Advertisement Admin
        </a>

    {% endif %}


    <!-- =================================================
         LEGAL
    ================================================== -->

    <div class="menu-section" data-i18n="menu.legal">
        Legal
    </div>

    <a href="/terms" data-i18n="nav.terms">
        Terms
    </a>

    <a href="/privacy" data-i18n="nav.privacy">
        Privacy
    </a>

    <a href="/data" data-i18n="nav.data">
        Data
    </a>

    <a href="/cookies" data-i18n="nav.cookies">
        Cookies
    </a>


    <!-- =================================================
         ACCOUNT
    ================================================== -->

    <div class="menu-section" data-i18n="menu.account">
        Account
    </div>

    {% if user %}

        <a href="/dashboard" data-i18n="nav.dashboard">
            Dashboard
        </a>

        <a href="/logout" data-i18n="nav.logout">
            Logout
        </a>

    {% else %}

        <a
            href="/login"
            class="discord-login"
            data-i18n="nav.login"
        >
            Login with Discord
        </a>

    {% endif %}

</nav>
