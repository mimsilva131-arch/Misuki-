<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>{{ title or "Misuki" }}</title>
    <style>
        :root{color-scheme:dark}
        *{box-sizing:border-box}
        html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
        body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#090a0f;color:#f5f7fb}
        main{width:min(620px,100%);text-align:center;padding:44px 28px;border:1px solid rgba(255,255,255,.10);border-radius:24px;background:rgba(255,255,255,.045);box-shadow:0 20px 70px rgba(0,0,0,.35)}
        .mark{width:58px;height:58px;margin:0 auto 22px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.08);font-size:27px}
        h1{margin:0 0 12px;font-size:clamp(25px,5vw,38px);letter-spacing:-.03em}
        p{margin:0 auto;color:rgba(245,247,251,.68);font-size:16px;line-height:1.65;max-width:500px}
        .code{margin-top:22px;font-size:12px;color:rgba(245,247,251,.38)}
        button{margin-top:28px;border:0;border-radius:12px;padding:11px 18px;background:#fff;color:#111;cursor:pointer;font:inherit;font-weight:650}
        button:hover{opacity:.9}
    </style>
</head>
<body>
<main>
    <div class="mark">⚠️</div>
    <h1>{{ title or "Misuki Temporarily Unavailable" }}</h1>
    <p>{{ message or "The service is temporarily unavailable. Please try again in a few moments." }}</p>
    {% if status_code %}<div class="code">Error {{ status_code }}</div>{% endif %}
    <button type="button" onclick="location.reload()">Try Again</button>
</main>
</body>
</html>
